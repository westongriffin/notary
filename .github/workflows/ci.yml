name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check JavaScript modules
        run: |
          for f in $(find js -name '*.js'); do node --check "$f"; done
      - name: Validate JSON config
        run: |
          node -e "for (const f of ['firebase.json','firestore.indexes.json','.firebaserc']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
      - name: Confirm Pages custom-domain files
        run: test "$(cat CNAME)" = "thenotarybook.com" && test -f .nojekyll

  # Deploys Firestore rules when a FIREBASE_SERVICE_ACCOUNT secret is configured.
  # See docs/FIREBASE_SETUP.md. Skipped silently otherwise.
  rules:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for deploy credentials
        id: creds
        run: echo "present=${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.present == 'true'
        with:
          node-version: 20
      - name: Deploy Firestore rules and indexes
        if: steps.creds.outputs.present == 'true'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@latest deploy --only firestore --project notary-wes-griffin --non-interactive
