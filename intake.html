<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1f5f8b">
  <title>Notary Book · Your details</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%231f5f8b'/><path d='M9 22V10h3l6 8v-8h3v12h-3l-6-8v8z' fill='white'/></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">N</span> Notary Book</div>
  </header>

  <main class="intake">
    <section id="intake-loading" class="card center">
      <p class="muted">Loading your form…</p>
    </section>

    <section id="intake-form-view" class="card" hidden>
      <h1>Your details for the notary</h1>
      <p id="intake-intro" class="muted small"></p>
      <form id="intake-form" novalidate>
        <label>Full legal name <input name="clientName" required maxlength="200" autocomplete="name"></label>
        <label>Address <input name="clientAddress" required maxlength="500" autocomplete="street-address"></label>
        <label>Document being notarized <input name="documentDescription" maxlength="500" placeholder="e.g. Power of attorney"></label>
        <label>Email <input name="clientEmail" type="email" maxlength="254" autocomplete="email" inputmode="email"></label>
        <label>Mobile phone <input name="clientPhone" type="tel" maxlength="40" autocomplete="tel" inputmode="tel"></label>
        <div class="sig-field">
          <span class="field-label">Your signature</span>
          <div class="sig-wrap"><canvas id="intake-signature" aria-label="Signature pad"></canvas></div>
          <div class="actions">
            <button id="intake-sig-clear" class="btn btn-sm" type="button">Clear signature</button>
            <span class="muted small">Sign with your finger or a stylus.</span>
          </div>
        </div>
        <p id="intake-error" class="error" hidden></p>
        <button id="intake-submit" class="btn btn-primary btn-block" type="submit">Send to notary</button>
        <p class="muted small center">Only your notary can see what you submit. This link works once.</p>
      </form>
    </section>

    <section id="intake-done" class="card center" hidden>
      <h1>Sent</h1>
      <p class="muted">Thanks, <span id="intake-done-name"></span>. Your notary has your details. You can close this page.</p>
    </section>

    <section id="intake-invalid" class="card center" hidden>
      <h1>This link isn't available</h1>
      <p id="intake-invalid-reason" class="muted"></p>
    </section>
  </main>

  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/intake.js"></script>
</body>
</html>
