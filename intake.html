<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#6b1f2a">
  <title>Notary Book · Your details</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="brand-mark" aria-hidden="true" focusable="false"><polygon points="32.000,2.000 34.864,4.750 38.237,2.656 40.467,5.941 44.202,4.594 45.700,8.271 49.634,7.729 50.334,11.638 54.294,11.926 54.167,15.895 57.981,17.000 57.031,20.855 60.532,22.729 58.801,26.303 61.836,28.864 59.400,32.000 61.836,35.136 58.801,37.697 60.532,41.271 57.031,43.145 57.981,47.000 54.167,48.105 54.294,52.074 50.334,52.362 49.634,56.271 45.700,55.729 44.202,59.406 40.467,58.059 38.237,61.344 34.864,59.250 32.000,62.000 29.136,59.250 25.763,61.344 23.533,58.059 19.798,59.406 18.300,55.729 14.366,56.271 13.666,52.362 9.706,52.074 9.833,48.105 6.019,47.000 6.969,43.145 3.468,41.271 5.199,37.697 2.164,35.136 4.600,32.000 2.164,28.864 5.199,26.303 3.468,22.729 6.969,20.855 6.019,17.000 9.833,15.895 9.706,11.926 13.666,11.638 14.366,7.729 18.300,8.271 19.798,4.594 23.533,5.941 25.763,2.656 29.136,4.750" fill="#6b1f2a"/><circle cx="32" cy="32" r="22" fill="none" stroke="#c9a24d" stroke-width="1.2"/><text x="32" y="42" text-anchor="middle" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-weight="700" font-size="30" fill="#f4efe6">N</text><polygon points="32.000,44.400 32.688,46.053 34.473,46.197 33.113,47.362 33.528,49.103 32.000,48.170 30.472,49.103 30.887,47.362 29.527,46.197 31.312,46.053" fill="#c9a24d"/></svg><span class="wordmark">Notary Book</span></div>
  </header>

  <main class="intake">
    <section id="intake-loading" class="card center">
      <p class="muted">Loading your form…</p>
    </section>

    <section id="intake-form-view" class="card" hidden>
      <h1>Your details for the notary</h1>
      <p id="intake-intro" class="muted small"></p>
      <form id="intake-form" novalidate>
        <label>Full legal name <input name="clientName" required maxlength="200" autocomplete="name"></label>
        <label>Address <input name="clientAddress" required maxlength="500" autocomplete="street-address"></label>
        <label>Document being notarized <input name="documentDescription" maxlength="500" placeholder="e.g. Power of attorney"></label>
        <label>Email <input name="clientEmail" type="email" maxlength="254" autocomplete="email" inputmode="email"></label>
        <label>Mobile phone <input name="clientPhone" type="tel" maxlength="40" autocomplete="tel" inputmode="tel"></label>
        <div class="sig-field">
          <span class="field-label">Your signature</span>
          <div class="sig-wrap"><canvas id="intake-signature" aria-label="Signature pad"></canvas></div>
          <div class="actions">
            <button id="intake-sig-clear" class="btn btn-sm" type="button">Clear signature</button>
            <span class="muted small">Sign with your finger or a stylus.</span>
          </div>
        </div>
        <p id="intake-error" class="error" hidden></p>
        <button id="intake-submit" class="btn btn-primary btn-block" type="submit">Send to notary</button>
        <p class="muted small center">Only your notary can see what you submit. This link works once.</p>
      </form>
    </section>

    <section id="intake-done" class="card center" hidden>
      <h1>Sent</h1>
      <p class="muted">Thanks, <span id="intake-done-name"></span>. Your notary has your details. You can close this page.</p>
    </section>

    <section id="intake-invalid" class="card center" hidden>
      <h1>This link isn't available</h1>
      <p id="intake-invalid-reason" class="muted"></p>
    </section>
  </main>

  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/intake.js"></script>
</body>
</html>
